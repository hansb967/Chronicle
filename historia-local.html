.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{font-size:18px}.date{color:var(--acc);font-variant:small-caps;letter-spacing:.06em}

input[type=text],textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:70px;resize:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.body{flex:1;overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.foot{padding:10px 14px;border-top:1px solid var(--line)}

.d{color:var(--acc);font-variant:small-caps;letter-spacing:.05em;border-bottom:1px solid var(--line);margin:14px 0 6px}

</style></head><body><div id="app"></div>

var RULES="You are the game master of a turn-based grand-strategy alternate-history simulation on a world map (coordinates are lat/lon in degrees). Be historically grounded, vivid and consequential: other nations have their own agendas, orders can fail, and the player never simply gets what they want. Reply with ONLY a JSON object, no markdown.";
var engine=null,MODEL="Qwen2.5-1.5B-Instruct-q4f16_1-MLC",STAT="";

async function start(){

    S={nation:n.value.trim(),start:y.value.trim(),diverge:dv.value.trim(),step:step,date:y.value.trim(),turn:1,stats:{stability:60,economy:55,military:50,influence:45},rel:{},nat:[],own:new Array(GW*GH).fill(0),cities:[],units:[],queue:[],dip:[],log:[],options:[],err:""};
    tab="orders";V={z:1,ox:0,oy:0};layout();start()};
  w.appendChild(er);w.appendChild(go);var old=load();
  if(old){var r=el("button","btn","Continue: "+old.nation+", "+old.date);r.style.cssText="margin-top:12px;width:100%";r.onclick=function(){S=old;V={z:1,ox:0,oy:0};layout();render()};w.appendChild(r)}
  app.appendChild(w);
}
function layout(){
  app.innerHTML="";var top=el("div","top"),h=el("div");h.appendChild(el("h1",null,S.nation));var dt=el("div","date");dt.id="dt";h.appendChild(dt);
  var nb=el("button","btn","New game");nb.onclick=function(){if(confirm("Leave this game? It stays saved until you start another."))setup()};top.appendChild(h);top.appendChild(nb);app.appendChild(top);
  var m=el("div","main"),mw=el("div","mapwrap");mw.innerHTML='<canvas></canvas><div class="zoom"><button id="zi">+</button><button id="zo">−</button></div><div id="loc">Tap the map to target a location</div>';
  var pn=el("div","panel"),tb=el("div","tabs");[["orders","Orders"],["dip","Diplomacy"],["log","Chronicle"]].forEach(function(t){var b=el("button",null,t[1]);b.dataset.t=t[0];b.onclick=function(){tab=t[0];render()};tb.appendChild(b)});
  var bd=el("div","body");bd.id="bd";var ft=el("div","foot");ft.id="ft";pn.appendChild(tb);pn.appendChild(bd);pn.appendChild(ft);m.appendChild(mw);m.appendChild(pn);app.appendChild(m);mapInit();
}
function field(ph){var t=el("textarea");t.placeholder=ph;t.onfocus=function(){lastTA=t};lastTA=t;return t}
function render(){
  $("#dt").textContent=S.date+" · Turn "+S.turn;
  [].forEach.call(document.querySelectorAll(".tabs button"),function(b){b.classList.toggle("on",b.dataset.t===tab)});
  var bd=$("#bd"),ft=$("#ft"),keep=bd.scrollTop;bd.innerHTML="";ft.innerHTML="";
  if(S.err)bd.appendChild(el("div","err",S.err));if(busy){var sd=el("div",null,STAT);sd.id="st";sd.style.cssText="color:var(--mute);font-size:14px";bd.appendChild(sd)}
  if(!S.log.length&&busy){bd.appendChild(el("div","dots","Building the world"));draw();return}
  if(tab==="orders"){
    var g=el("div","stats");STATS.forEach(function(s){var d=el("div");d.appendChild(el("div",null,s[1]+" "+S.stats[s[0]]));var b=el("div","bar"),i=el("i");i.style.width=S.stats[s[0]]+"%";b.appendChild(i);d.appendChild(b);g.appendChild(d)});bd.appendChild(g);
    bd.appendChild(el("h3",null,"Actions ("+S.queue.length+"/3)"));
    S.queue.forEach(function(a,i){var r=el("div","act");r.appendChild(el("span",null,a));var x=el("button",null,"×");x.onclick=function(){S.queue.splice(i,1);save();render()};r.appendChild(x);bd.appendChild(r)});
    if(S.queue.length<3){var t=field("Issue an order, e.g. “Raise an army in Anatolia” (tap the map to add a location)"),add=el("button","btn","Add action");add.style.cssText="margin-top:8px;width:100%";add.onclick=function(){if(t.value.trim()){S.queue.push(t.value.trim());save();render()}};bd.appendChild(t);bd.appendChild(add);
      var c=el("div","chips");(S.options||[]).forEach(function(o){var b=el("button","chip",o);b.onclick=function(){t.value=o};c.appendChild(b)});bd.appendChild(c)}
    var rk=Object.keys(S.rel);if(rk.length){var h=el("h3",null,"Relations");h.style.marginTop="16px";bd.appendChild(h);rk.forEach(function(k){var r=el("div","rel");r.appendChild(el("span",null,k));var v=S.rel[k];r.appendChild(el("span",v>=0?"pos":"neg",(v>0?"+":"")+v));bd.appendChild(r)})}
  }else if(tab==="dip"){
    bd.appendChild(el("p",null,"Unlimited diplomacy each turn. Agreements are carried into the simulation when you end your turn."));
    S.dip.forEach(function(d){bd.appendChild(el("div","msg me","To "+d.to+": "+d.me));if(d.reply)bd.appendChild(el("div","msg",d.to+": "+d.reply));if(d.deal)bd.appendChild(el("div","ev","Agreement: "+d.deal))});
    if(busy)bd.appendChild(el("div","dots","Awaiting reply"));
    var sel=el("select");S.nat.forEach(function(x){if(x.n!==S.nation){var o=el("option",null,x.n);sel.appendChild(o)}});sel.style.marginBottom="8px";
    var t=field("Your message, proposal or ultimatum…"),b=el("button","btn p","Send");b.style.cssText="margin-top:8px;width:100%";b.disabled=busy||!sel.value;
    b.onclick=function(){if(t.value.trim())dipSend(sel.value,t.value.trim())};ft.appendChild(sel);ft.appendChild(t);ft.appendChild(b);
  }else{
    S.log.slice().reverse().forEach(function(l){bd.appendChild(el("div","d",l.date));(l.acts||[]).forEach(function(a){bd.appendChild(el("div","msg me",a))});if(l.text)bd.appendChild(el("p",null,l.text));(l.events||[]).forEach(function(e){var d=el("div","ev"+(e.major?"":" m"));d.appendChild(el("b",null,(e.major?"★ ":"")+e.title));d.appendChild(el("span",null,e.text));bd.appendChild(d)})});
  }
  if(tab!=="dip"){var e=el("button","btn p",busy?"The world turns…":"End turn");e.style.width="100%";e.disabled=busy;e.onclick=endTurn;ft.appendChild(e)}
  bd.scrollTop=tab==="dip"?bd.scrollHeight:keep;draw();
}
setup();
})();
</script></body></html>
